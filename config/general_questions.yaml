# General, law-based yes/no checks for the `questions` check (checks/questions.py).
#
# ORIGIN: copied verbatim (instructions, category, basis, list) from the teammate prototype
#   sprintd_zurich @ 47c4ffd, fraud_analysis/questions.json ("gesetzlich" + "intern", version 1, threshold 0.7).
# They were written from the law / bank policy WITHOUT looking at the case transcripts or labels ("Die Fragen
# beschreiben die allgemeine Regel, ohne Beispiele und ohne Ausnahmen aus Testdaten"), unlike our fact questions
# in config/policy_table.yaml, which were tuned while reading dev transcripts (research/findings/RQ10.md, R3/R4 in
# research/DECISIONS.md). Do NOT edit them after looking at results: that would defeat the experiment
# (experiments/kev_vs_facts.yaml). Paraphrase-robustness copy: config/general_questions_para.yaml.
#
# Decision rule (theirs): call risk = max p(yes) over ALL questions; alert at >= threshold.
# `family`: which of our families shows the question (UI, per-family metrics). Added by us from the question text
# and the family labels only, before any run; every question goes to exactly one alarmable family, so the call
# score (max over families) is still the max over all 15 questions. category / basis / list: display only.
# Edits to instructions, criteria, family or category change the check's cache key (the questions hash).
source: sprintd_zurich@47c4ffd:fraud_analysis/questions.json
threshold: 0.7
questions:
  # -- gesetzlich ------------------------------------------------------------------------------------
  insider_trading:
    list: gesetzlich
    family: trade
    category: Insiderhandel
    basis: FinfraG Art. 142 / 154
    instructions: Does someone want to buy or sell financial instruments because of non-public, price-relevant information?
  insider_disclosure:
    list: gesetzlich
    family: trade
    category: Insiderhandel
    basis: FinfraG Art. 142 / 154
    instructions: Does someone pass on non-public, price-relevant information, or recommend a trade based on it?
  market_manipulation:
    list: gesetzlich
    family: trade
    category: Marktmanipulation
    basis: FinfraG Art. 143 / 155
    instructions: Does someone try to influence a market price through orders or information?
  aml_source_of_funds:
    list: gesetzlich
    family: documentation
    category: Geldwäscherei
    basis: StGB Art. 305bis, GwG Art. 6
    instructions: Does someone conceal or refuse to explain where assets come from?
  aml_structuring:
    list: gesetzlich
    family: splitting
    category: Geldwäscherei
    basis: StGB Art. 305bis, GwG Art. 6 / 9
    instructions: Does someone arrange transactions so that a legal threshold or reporting obligation is avoided?
  aml_hidden_beneficiary:
    list: gesetzlich
    family: documentation
    category: Geldwäscherei
    basis: GwG Art. 4
    instructions: Does someone conceal who the actual owner or beneficiary of assets is?
  confidential_disclosure:
    list: gesetzlich
    family: disclosure
    category: Vertrauliche Informationen
    basis: BankG Art. 47, DSG, StGB Art. 162
    instructions: Does someone reveal confidential information to a person who is not entitled to receive it?
  confidential_request:
    list: gesetzlich
    family: disclosure
    category: Vertrauliche Informationen
    basis: BankG Art. 47, DSG, StGB Art. 162
    instructions: Does someone try to obtain confidential information they are not entitled to?
  false_records:
    list: gesetzlich
    family: documentation
    category: Falsche Dokumentation
    basis: StGB Art. 251
    instructions: Does someone want false information to be recorded?
  bribery:
    list: gesetzlich
    family: splitting
    category: Bestechung
    basis: StGB Art. 322octies / 322novies
    instructions: Does someone offer or request an undue advantage in exchange for an action?
  # -- intern ----------------------------------------------------------------------------------------
  withheld_information:
    list: intern
    family: documentation
    category: Falsche Dokumentation
    basis: interne Policy
    instructions: Does someone want relevant information withheld from the people who need it for a decision?
  control_circumvention:
    list: intern
    family: splitting
    category: Kontrollumgehung
    basis: interne Policy
    instructions: Does someone try to get around an internal approval, limit or control?
  credential_disclosure:
    list: intern
    family: access
    category: Zugangsdaten
    basis: interne Policy
    instructions: Does someone reveal a valid access credential?
  credential_request:
    list: intern
    family: access
    category: Zugangsdaten
    basis: interne Policy
    instructions: Does someone ask for another person's access credentials?
  manipulated_customer:
    list: intern
    family: access
    category: Kunde als Betrugsopfer
    basis: interne Policy, StGB Art. 146
    instructions: Does someone appear to act under pressure or deception from a third party?
