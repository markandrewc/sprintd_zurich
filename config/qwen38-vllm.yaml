# Qwen3.8-27B 4-bit (RedHatAI/Qwen3.8-27B-INT4, W4A16 g128, Apache-2.0) on a recent vLLM: the 24 GB A5000 box
# (driver 595 / CUDA 13). Same design as config/qwen38.yaml (3-bit GGUF on the 4070 via llama.cpp); only the
# server and the quantisation differ, so q38_* vs q38w4_* measures what the stronger quantisation costs.
# vLLM reports the checkpoint in GET /models (root), so no cache_tag is needed.
#   scripts/remote/serve_vllm_q38.sh   (on the A5000 box)
extends: qwen38.yaml
description: Qwen3.8-27B INT4 (vLLM, 24 GB) as the facts backend; roles from the cache (research only)

llms:
  q38:
    type: openai_compat
    base_url: ${CALLGUARD_Q38_URL:-http://127.0.0.1:8000/v1}
    model: callguard-llm
    cache_tag: null
    timeout: 600
    json_mode: json_schema
    supports_n: true
    max_concurrency: 8
    extra_body: {chat_template_kwargs: {enable_thinking: false}}

checks:
  - name: keywords
    type: keywords
    weight: 0.15
    fuzzy: 90
  - name: patterns
    type: patterns
    weight: 0.1
  - name: facts
    type: facts
    llm: q38
    parallel: 8
    evidence: false
    weight: 1.0
