# R3 paraphrase robustness (research only, not a candidate): config/policy_table.yaml with every
# fact question (en and de) reworded with the same meaning, written without reading transcripts.
# Ids, labels, roles and rules are identical. Generated by scripts/research/make_para_table.py.
families:
  trade:
    facts:
    - id: wish
      label: Eigener Handelswunsch geäussert
      role: act
      de: Bringt jemand im Gespräch (in der Regel die Kundin/der Kunde) zum Ausdruck, selbst ein bestimmtes Wertpapier
        kaufen, verkaufen oder handeln zu wollen, egal ob die Beratung das danach ablehnt oder der Auftrag nie ausgeführt
        wird?
      en: Does anyone on the call (typically the client) state that they personally want to purchase, sell or trade
        a particular security, regardless of whether the advisor later declines or the order is never carried out?
    - id: inside_info
      label: Begründet mit nicht öffentlicher Insider-Information
      role: context
      de: Stützt diese Person ihren Wunsch zu handeln auf etwas, das sie persönlich über einen internen oder vertraulichen
        Kanal erfahren hat (etwa Verwandte, die eigene Firma, die Finanzabteilung, etwas "unter vier Augen" Gesagtes
        oder vorzeitig gesehene Zahlen oder Unterlagen), und das noch nicht bekannt gemacht wurde (etwa Quartalsergebnisse,
        eine Übernahme oder ein grosser Auftrag vor der offiziellen Mitteilung)?
      en: Is the reason this person gives for wanting to trade something they personally learned from an insider
        or confidential channel (for example a relative, their employer, the finance team, something told "just
        between us", or numbers or papers seen ahead of time), where that information has not been made public yet
        (for example earnings figures, an acquisition or a big contract before it is announced)?
    - id: public
      label: Information bereits öffentlich
      role: exculpatory
      de: Wird im Gespräch erwähnt, dass die Information hinter dem Handelswunsch schon veröffentlicht wurde (etwa
        per Medienmitteilung, in einem publizierten Bericht oder als frei zugängliche Zahlen)?
      en: Is it stated during the call that the information behind the wish to trade has already been made public
        (for example in a press release, a published report or freely available figures)?
    rules:
    - id: trade.alarm_1
      label: alarm
      when: wish = yes and inside_info = yes and public != yes
      text: Handelswunsch mit nicht öffentlicher Information aus interner Quelle.
    - id: trade.review_1
      label: review
      when: wish = yes and inside_info = unclear and public != yes
      text: Handelswunsch, aber Herkunft oder Öffentlichkeit der Information bleibt offen.
    - id: trade.no_alert
      label: no_alert
      when: 'true'
      text: Kein Handelswunsch auf Basis nicht öffentlicher Information.
  access:
    facts:
    - id: spoken
      label: Code/Wert am Telefon vorgelesen
      role: act
      de: Spricht jemand (in der Regel die Kundin/der Kunde) am Telefon die Ziffern oder Zeichen von etwas aus,
        das eine PIN, eine TAN, ein Passwort oder ein Code zum Bestätigen, Freigeben oder Einloggen sein könnte,
        auch wenn nicht klar ist, ob der Wert noch gilt, und auch wenn die Beratung die Person danach unterbricht?
        (Bloss die letzten vier Ziffern, eine Referenznummer oder ein Geldbetrag reichen nicht.)
      en: Does anyone (typically the client) say aloud over the phone the digits or characters of something that
        could be a PIN, TAN, password, or a code for confirming, approving or logging in, even when it is not clear
        whether that value is still valid and even when the advisor interrupts them afterwards? (Merely the final
        four digits, a reference number or a sum of money is not enough.)
    - id: current
      label: Wert gehört zum laufenden, gültigen Vorgang
      role: context
      de: Ist der genannte Wert Teil eines gerade laufenden Login- oder Freigabeprozesses, der noch gültig ist?
        Antworte "unknown", wenn das Gespräch offen lässt, zu welchem Prozess er gehört oder ob er noch gilt.
      en: Is the value that was spoken part of an ongoing login or approval procedure that is still valid? Reply
        "unknown" if the call leaves open which procedure it is for or whether it is still valid.
    - id: validity_open
      label: Im Gespräch offen, ob der Wert gültig ist
      role: context
      de: Erwähnt jemand im Gespräch, dass niemand weiss oder nicht klar ist, ob der vorgelesene Wert noch gilt
        oder zu welchem Prozess er gehört?
      en: Does anyone on the call state that nobody knows, or it is not clear, whether the value that was read aloud
        is still valid or which procedure it is for?
    - id: expired_or_sample
      label: Wert abgelaufen oder Muster
      role: exculpatory
      de: Wird der genannte Wert im Gespräch als nicht mehr gültig, abgelaufen, unbrauchbar oder als Beispiel- bzw.
        Musterwert (etwa aus einem Handbuch oder einer Hilfeseite) beschrieben?
      en: Does the call describe the spoken value as no longer valid, expired, unusable, or as a demonstration or
        example value (for instance taken from a manual or a help page)?
    - id: asked_by_advisor
      label: Code von der Beratung erfragt
      role: context
      de: Verlangt die Beraterin/der Berater von der Kundin/dem Kunden, eine PIN, eine TAN, ein Passwort oder einen
        Code zu sagen oder vorzulesen?
      en: Does the advisor request that the client say or read aloud a PIN, TAN, password or code?
    rules:
    - id: access.alarm_1
      label: alarm
      when: spoken = yes and current = yes and expired_or_sample != yes
      text: Ein gültiger Zugangswert wurde am Telefon ausgesprochen.
    - id: access.review_1
      label: review
      when: spoken = yes and validity_open = yes and expired_or_sample != yes
      text: Ein Wert wurde vorgelesen, aber unklar ist, zu welchem Vorgang er gehört oder ob er gültig ist.
    - id: access.no_alert
      label: no_alert
      when: 'true'
      text: Kein gültiger Zugangswert ausgesprochen.
  disclosure:
    facts:
    - id: data_given
      label: Konkrete Daten einer Drittperson herausgegeben
      role: act
      de: Teilt die Beraterin/der Berater der anrufenden Person konkrete Zahlen oder Details aus einem Konto, Kredit
        oder Kundendossier mit, das nicht der anrufenden Person, sondern jemand anderem gehört (etwa einen Saldo,
        die Kredithöhe, einen Zinstermin oder Zahlungen)?
      en: Does the advisor give the caller specific numbers or details taken from an account, loan or client record
        belonging to a person other than the caller (for example a balance, the size of a loan, an interest due
        date, or payments)?
    - id: third_party_request
      label: Auskunft über Drittperson verlangt
      role: context
      de: Verlangt die anrufende Person von der Beratung Auskünfte, die die Bank zu Konten, Krediten oder Bankgeschäften
        einer anderen Person (und nicht zu den eigenen) hat?
      en: Does the caller request that the advisor share details the bank has on the accounts, loans or banking
        dealings of some other person (rather than the caller's own)?
    - id: authorized
      label: Vollmacht/Auskunftsrecht bestätigt
      role: authorization
      de: Hält die Beratung im Gespräch fest, dass für die anrufende Person eine hinterlegte Vollmacht oder ein
        Auskunftsrecht besteht, das genau diese Auskunft umfasst?
      en: Does the advisor state during the call that the caller holds a power of attorney or an information right
        on file that covers precisely the information in question?
    - id: not_authorized
      label: Keine Vollmacht/Berechtigung festgestellt
      role: authorization
      de: Hält die Beratung im Gespräch fest, dass der anrufenden Person für diese Auskunft eine Vollmacht, ein
        Auskunftsrecht oder eine Berechtigung fehlt?
      en: Does the advisor state during the call that the caller lacks a power of attorney, an information right
        or any permission for the information in question?
    - id: beyond_scope
      label: Auskunft über den Umfang der Vollmacht hinaus
      role: context
      de: Reicht die erteilte Auskunft weiter, als es der bestätigte Umfang einer Vollmacht erlaubt?
      en: Does the information that was disclosed exceed what the confirmed power of attorney covers?
    rules:
    - id: disclosure.alarm_1
      label: alarm
      when: data_given = yes and not_authorized = yes
      text: Daten einer Drittperson trotz festgestellt fehlender Berechtigung herausgegeben.
    - id: disclosure.alarm_2
      label: alarm
      when: data_given = yes and beyond_scope = yes
      text: Auskunft über den bestätigten Umfang der Vollmacht hinaus.
    - id: disclosure.review_1
      label: review
      when: data_given = yes and authorized != yes
      text: Daten einer Drittperson herausgegeben, Berechtigung nicht bestätigt.
    - id: disclosure.review_2
      label: review
      when: third_party_request = yes and authorized = unclear and not_authorized = unclear
      text: Auskunft über eine Drittperson verlangt, Berechtigung bleibt ungeklärt.
    - id: disclosure.no_alert
      label: no_alert
      when: 'true'
      text: Keine unberechtigte Auskunft an Dritte.
  documentation:
    facts:
    - id: omit_request
      label: Verlangt, etwas nicht zu protokollieren
      role: act
      de: Fordert oder wünscht jemand, dass eine Tatsache nicht festgehalten, nicht in die Notizen geschrieben oder
        einer internen Abteilung (etwa der Kreditprüfung oder der Finanzierungsstelle) vorenthalten wird?
      en: Does anyone request or insist that some fact be left out of the record or the notes, or be kept from an
        internal department (for example the credit review or the financing team)?
    - id: relevant
      label: Verborgene Tatsache ist relevant
      role: context
      de: Spielt die Tatsache, die nicht festgehalten oder verborgen werden soll, für den Vorgang eine Rolle, etwa
        eine offene, zurückzuzahlende Schuld oder Verpflichtung bei einer Kreditprüfung?
      en: Does the fact that is supposed to be kept out of the record or hidden matter for the process, for example
        an outstanding debt or obligation that must be repaid, in a credit review?
    - id: correction_or_private
      label: Nur Korrektur oder private Details
      role: exculpatory
      de: Soll lediglich ein falscher oder nicht dazugehörender früherer Eintrag berichtigt oder gelöscht werden,
        oder sollen persönliche, für den Vorgang belanglose Details weggelassen werden, während alles Wesentliche
        sichtbar bleibt?
      en: Is the point merely to fix or delete an incorrect or unrelated earlier entry, or to omit personal details
        that do not matter for the process, with everything that matters remaining visible?
    rules:
    - id: documentation.alarm_1
      label: alarm
      when: omit_request = yes and relevant = yes and correction_or_private != yes
      text: Relevante Verpflichtung soll vor der zuständigen Stelle verborgen werden.
    - id: documentation.review_1
      label: review
      when: omit_request = yes and relevant = unclear and correction_or_private != yes
      text: Etwas soll verborgen werden, ob es relevant ist, bleibt offen.
    - id: documentation.no_alert
      label: no_alert
      when: 'true'
      text: Keine relevante Angabe soll verschwiegen werden.
  splitting:
    facts:
    - id: split_request
      label: Aufteilung in Teilbeträge verlangt
      role: act
      de: Wünscht jemand, dass eine Zahlung oder Rechnung in mehrere kleinere Beträge oder Raten zerlegt wird?
      en: Does anyone request that one payment or invoice be broken up into multiple smaller amounts or instalments?
    - id: avoid_control
      label: Zweck ist, Kontrolle oder Freigabe zu umgehen
      role: context
      de: Ist der Zweck der Aufteilung, ob ausdrücklich gesagt oder offensichtlich, eine interne Prüfung, Genehmigung,
        Limite oder Zuständigkeit zu umgehen?
      en: Is the purpose of the split, whether said outright or plainly evident, to bypass an internal check, sign-off,
        limit or area of responsibility?
    - id: single_invoice
      label: Teilbeträge gehören zu einer einzigen Rechnung
      role: context
      de: Sind die kleineren Beträge alle Teil ein und derselben Rechnung oder Zahlung?
      en: Are the smaller amounts all part of one and the same invoice or payment?
    - id: harmless
      label: Unabhängige Rechnungen oder nur Beispiel
      role: exculpatory
      de: Geht es um mehrere voneinander unabhängige, echte Rechnungen, die jeweils bei Fälligkeit bezahlt werden,
        oder wird das Umgehen einer Kontrolle nur zurückgewiesen oder als Beispiel für eine Schulung erwähnt?
      en: Is this about multiple separate, real invoices that are each paid when due, or is bypassing a check only
        rejected or mentioned as an example for training?
    rules:
    - id: splitting.alarm_1
      label: alarm
      when: split_request = yes and avoid_control = yes and single_invoice != no and harmless != yes
      text: Aufteilung einer Zahlung, um eine interne Kontrolle zu umgehen.
    - id: splitting.review_1
      label: review
      when: split_request = yes and avoid_control = unclear and harmless != yes
      text: Teilbeträge verlangt, aber Zusammenhang oder Motiv bleibt unklar.
    - id: splitting.no_alert
      label: no_alert
      when: 'true'
      text: Keine Aufteilung zur Umgehung einer Kontrolle.
