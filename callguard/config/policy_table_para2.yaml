# R6 paraphrase ensemble (research): config/policy_table.yaml with every fact question (en and de)
# reworded a SECOND time, independently of config/policy_table_para.yaml and in a different style,
# written without reading transcripts or results. Ids, labels, roles and rules are identical.
# Generated by scripts/research/make_para2_table.py.
families:
  trade:
    facts:
    - id: wish
      label: Eigener Handelswunsch geäussert
      role: act
      de: Sagt in diesem Gespräch jemand (meistens die Kundin/der Kunde), dass er oder sie selbst ein bestimmtes Wertpapier
        kaufen, verkaufen oder handeln lassen möchte? Zählt auch, wenn die Beratung ablehnt oder der Auftrag nie erteilt wird.
      en: In this call, does someone (most often the customer) say they themselves want a specific security bought, sold or
        traded for them? Count it even if the advisor refuses or the order is never placed.
    - id: inside_info
      label: Begründet mit nicht öffentlicher Insider-Information
      role: context
      de: Stützt sich diese Person beim Handelswunsch auf Wissen aus internen oder vertraulichen Quellen (Arbeitgeber, Finanzabteilung,
        ein Familienmitglied, früh gesehene Unterlagen oder Zahlen, etwas "inoffiziell" Gesagtes), das der Öffentlichkeit
        noch nicht mitgeteilt wurde, etwa Ergebnisse, eine Übernahme oder ein Grossauftrag?
      en: Does that person base the wish to trade on knowledge they got from inside or confidential sources (their employer,
        the finance department, a family member, documents or figures seen early, something said "off the record") that has
        not been announced to the public yet, such as results, a takeover or a major order?
    - id: public
      label: Information bereits öffentlich
      role: exculpatory
      de: Wird in diesem Gespräch gesagt, dass die Information hinter dem Handelswunsch schon öffentlich ist, etwa in einer
        Medienmitteilung angekündigt, in einem veröffentlichten Bericht enthalten oder für alle zugänglich?
      en: In this call, is the information behind the trading wish said to be public already, for instance announced in a
        press release, contained in a published report, or available to everyone?
    rules:
    - id: trade.alarm_1
      label: alarm
      when: wish = yes and inside_info = yes and public != yes
      text: Handelswunsch mit nicht öffentlicher Information aus interner Quelle.
    - id: trade.review_1
      label: review
      when: wish = yes and inside_info = unclear and public != yes
      text: Handelswunsch, aber Herkunft oder Öffentlichkeit der Information bleibt offen.
    - id: trade.no_alert
      label: no_alert
      when: 'true'
      text: Kein Handelswunsch auf Basis nicht öffentlicher Information.
  access:
    facts:
    - id: spoken
      label: Code/Wert am Telefon vorgelesen
      role: act
      de: Spricht in diesem Gespräch jemand (meistens die Kundin/der Kunde) die Ziffern oder Zeichen eines Werts aus, der
        eine PIN, eine TAN, ein Passwort oder ein Code zum Anmelden, Bestätigen oder Freigeben sein könnte? Zählt auch, wenn
        niemand weiss, ob der Wert noch funktioniert, und auch, wenn die Beratung die Person unterbricht. (Nur die letzten
        vier Ziffern, eine Referenznummer oder ein Geldbetrag zählen nicht.)
      en: In this call, does someone (most often the customer) speak out the digits or characters of a value that might be
        a PIN, a TAN, a password, or a code used to log in, confirm or release something? Count it even if nobody knows whether
        the value still works and even if the advisor cuts them off. (Just the last four digits, a reference number or an
        amount of money does not count.)
    - id: current
      label: Wert gehört zum laufenden, gültigen Vorgang
      role: context
      de: Gehört der ausgesprochene Wert zu einem Anmelde- oder Freigabevorgang, der noch läuft und noch gültig ist? Wenn
        das Gespräch offen lässt, zu welchem Vorgang er gehört oder ob er noch gilt, antworte "unknown".
      en: Is the value that was spoken tied to a login or release process that is still running and still valid? If the call
        leaves open which process it is for or whether it is still valid, answer "unknown".
    - id: validity_open
      label: Im Gespräch offen, ob der Wert gültig ist
      role: context
      de: Äussert in diesem Gespräch jemand, dass er nicht weiss oder dass ungewiss ist, ob der vorgelesene Wert noch funktioniert
        oder zu welchem Vorgang er gehört?
      en: In this call, does anyone express that they do not know, or that it is uncertain, whether the value that was read
        out still works or which process it is for?
    - id: expired_or_sample
      label: Wert abgelaufen oder Muster
      role: exculpatory
      de: Wird der ausgesprochene Wert in diesem Gespräch als abgelaufen, nicht mehr gültig oder unbrauchbar bezeichnet, oder
        als Platzhalter oder Beispielwert dargestellt (etwa aus einer Anleitung oder einer Hilfeseite)?
      en: In this call, is the spoken value called expired, no longer valid or unusable, or is it presented as a dummy or
        example value (for instance taken from a guide or a help page)?
    - id: asked_by_advisor
      label: Code von der Beratung erfragt
      role: context
      de: Verlangt die Beraterin/der Berater in diesem Gespräch von der Kundin/dem Kunden eine PIN, eine TAN, ein Passwort
        oder einen Code, d.h. bittet sie oder ihn, ihn zu sagen oder vorzulesen?
      en: In this call, does the advisor request a PIN, TAN, password or code from the customer, asking them to say it or
        read it out?
    rules:
    - id: access.alarm_1
      label: alarm
      when: spoken = yes and current = yes and expired_or_sample != yes
      text: Ein gültiger Zugangswert wurde am Telefon ausgesprochen.
    - id: access.review_1
      label: review
      when: spoken = yes and validity_open = yes and expired_or_sample != yes
      text: Ein Wert wurde vorgelesen, aber unklar ist, zu welchem Vorgang er gehört oder ob er gültig ist.
    - id: access.no_alert
      label: no_alert
      when: 'true'
      text: Kein gültiger Zugangswert ausgesprochen.
  disclosure:
    facts:
    - id: data_given
      label: Konkrete Daten einer Drittperson herausgegeben
      role: act
      de: Gibt die Beraterin/der Berater in diesem Gespräch der anrufenden Person bestimmte Zahlen oder Fakten aus einem Konto,
        einem Darlehen oder einem Kundendossier einer anderen Person als der anrufenden preis (etwa einen Saldo, die Höhe
        eines Darlehens, einen Zinstermin oder Zahlungen)?
      en: In this call, does the advisor reveal to the caller specific numbers or facts from an account, a loan or a client
        file of a person other than the caller (for instance a balance, the amount of a loan, an interest due date, or payments)?
    - id: third_party_request
      label: Auskunft über Drittperson verlangt
      role: context
      de: Will die anrufende Person in diesem Gespräch erfahren, was die Bank über die Konten, Darlehen oder Bankgeschäfte
        einer anderen Person weiss, also nicht über die eigenen?
      en: In this call, does the caller ask to be told what the bank knows about the accounts, loans or banking business of
        some other person, not about their own?
    - id: authorized
      label: Vollmacht/Auskunftsrecht bestätigt
      role: authorization
      de: Bestätigt die Beratung in diesem Gespräch, dass für die anrufende Person eine Vollmacht oder ein Auskunftsrecht
        hinterlegt ist und dass es genau die verlangte Auskunft abdeckt?
      en: In this call, does the advisor confirm that a power of attorney or an information right for the caller is on file
        and that it covers precisely the information asked for?
    - id: not_authorized
      label: Keine Vollmacht/Berechtigung festgestellt
      role: authorization
      de: Stellt die Beratung in diesem Gespräch fest, dass die anrufende Person weder eine Vollmacht noch ein Auskunftsrecht
        noch eine Erlaubnis für diese Auskunft hat?
      en: In this call, does the advisor state that the caller does not have a power of attorney, an information right or
        permission to receive this information?
    - id: beyond_scope
      label: Auskunft über den Umfang der Vollmacht hinaus
      role: context
      de: Reicht das, was herausgegeben wurde, weiter, als es der bestätigte Umfang einer Vollmacht erlaubt?
      en: Does what was disclosed reach further than the confirmed extent of a power of attorney allows?
    rules:
    - id: disclosure.alarm_1
      label: alarm
      when: data_given = yes and not_authorized = yes
      text: Daten einer Drittperson trotz festgestellt fehlender Berechtigung herausgegeben.
    - id: disclosure.alarm_2
      label: alarm
      when: data_given = yes and beyond_scope = yes
      text: Auskunft über den bestätigten Umfang der Vollmacht hinaus.
    - id: disclosure.review_1
      label: review
      when: data_given = yes and authorized != yes
      text: Daten einer Drittperson herausgegeben, Berechtigung nicht bestätigt.
    - id: disclosure.review_2
      label: review
      when: third_party_request = yes and authorized = unclear and not_authorized = unclear
      text: Auskunft über eine Drittperson verlangt, Berechtigung bleibt ungeklärt.
    - id: disclosure.no_alert
      label: no_alert
      when: 'true'
      text: Keine unberechtigte Auskunft an Dritte.
  documentation:
    facts:
    - id: omit_request
      label: Verlangt, etwas nicht zu protokollieren
      role: act
      de: Will in diesem Gespräch jemand, dass eine Tatsache nicht in die Akten oder die Notiz kommt oder einer internen Stelle
        (etwa der Kreditprüfung oder der Finanzierungsstelle) vorenthalten wird, und bittet darum oder besteht darauf?
      en: In this call, does someone want a fact to stay out of the records or the notes, or to be kept from an internal department
        (for instance the credit check or the financing unit), and ask or insist on that?
    - id: relevant
      label: Verborgene Tatsache ist relevant
      role: context
      de: Ist die Tatsache, die nicht in die Akten soll oder vorenthalten werden soll, für die Sache wichtig, etwa eine offene
        Schuld oder Verpflichtung, die zurückgezahlt werden muss, bei einer Kreditprüfung?
      en: Is the fact that is to be kept out of the records or withheld important for the matter at hand, for instance an
        outstanding debt or obligation that must be repaid, during a credit check?
    - id: correction_or_private
      label: Nur Korrektur oder private Details
      role: exculpatory
      de: Geht es bei der Bitte nur darum, einen alten Eintrag zu berichtigen oder zu löschen, der falsch ist oder nicht dazugehört,
        oder persönliche Details nicht aufzuschreiben, die für die Sache keine Rolle spielen, während alles Wichtige festgehalten
        bleibt?
      en: Is the request only about fixing or deleting an old entry that is wrong or does not belong there, or about not writing
        down personal details that do not matter for the matter at hand, while everything that does matter stays on record?
    rules:
    - id: documentation.alarm_1
      label: alarm
      when: omit_request = yes and relevant = yes and correction_or_private != yes
      text: Relevante Verpflichtung soll vor der zuständigen Stelle verborgen werden.
    - id: documentation.review_1
      label: review
      when: omit_request = yes and relevant = unclear and correction_or_private != yes
      text: Etwas soll verborgen werden, ob es relevant ist, bleibt offen.
    - id: documentation.no_alert
      label: no_alert
      when: 'true'
      text: Keine relevante Angabe soll verschwiegen werden.
  splitting:
    facts:
    - id: split_request
      label: Aufteilung in Teilbeträge verlangt
      role: act
      de: Bittet in diesem Gespräch jemand darum, eine Zahlung oder Rechnung in mehreren kleineren Teilbeträgen statt auf
        einmal zu bezahlen?
      en: In this call, does someone ask for a payment or an invoice to be paid as several smaller partial amounts instead
        of one?
    - id: avoid_control
      label: Zweck ist, Kontrolle oder Freigabe zu umgehen
      role: context
      de: Ist der Grund für das Aufteilen, ausdrücklich gesagt oder aus dem Gespräch offensichtlich, eine interne Prüfung,
        eine nötige Freigabe, eine Limite oder die Zuständigkeit für die Bewilligung zu vermeiden?
      en: Is the reason for splitting, either said explicitly or obvious from the call, to avoid an internal check, a required
        sign-off, a limit or who is responsible for approving it?
    - id: single_invoice
      label: Teilbeträge gehören zu einer einzigen Rechnung
      role: context
      de: Ergeben die kleineren Beträge zusammen ein und dieselbe Rechnung oder Zahlung?
      en: Do the smaller amounts together make up one and the same invoice or payment?
    - id: harmless
      label: Unabhängige Rechnungen oder nur Beispiel
      role: exculpatory
      de: Sind es wirklich mehrere getrennte, echte Rechnungen, die jeweils bei Fälligkeit bezahlt werden, oder wird das Umgehen
        einer Kontrolle nur zurückgewiesen oder als Beispiel aus einer Schulung erwähnt?
      en: Are these really several separate, genuine invoices, each paid when it falls due, or is avoiding a control merely
        rejected or mentioned as an example from training?
    rules:
    - id: splitting.alarm_1
      label: alarm
      when: split_request = yes and avoid_control = yes and single_invoice != no and harmless != yes
      text: Aufteilung einer Zahlung, um eine interne Kontrolle zu umgehen.
    - id: splitting.review_1
      label: review
      when: split_request = yes and avoid_control = unclear and harmless != yes
      text: Teilbeträge verlangt, aber Zusammenhang oder Motiv bleibt unklar.
    - id: splitting.no_alert
      label: no_alert
      when: 'true'
      text: Keine Aufteilung zur Umgehung einer Kontrolle.
