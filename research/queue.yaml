# Research backlog. The overnight agent picks the highest-priority `todo` item whose `needs` exist
# (see docs/STATUS.md), sets status running -> done | rejected | blocked, and appends new items.
# priority: 1 = do first. cost: rough GPU time on the 4070 for all 60 calls (estimate; refine from journal).
# Model ids / licences: docs/research/*.md (verify there before downloading).

items:
