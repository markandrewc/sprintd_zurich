  - {id: B1, group: bringup, priority: 1, status: done, rq: [RQ12], needs: [gpu-setup],
     title: "Bring-up: setup, doctor all OK, one call end to end on gpu-12gb, timings + VRAM in journal"}
  - {id: B2, group: bringup, priority: 1, status: done, needs: [B1],
     title: "Transcribe all 60 calls with the default ASR (Swiss German turbo int8_float16) and run the v1 checks: first real baseline numbers on GPU"}

