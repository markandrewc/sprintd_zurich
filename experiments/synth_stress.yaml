# RQ5 / RQ10: OUT-OF-SAMPLE test of the `facts` question wording (config/policy_table.yaml was worded while
# reading dev transcripts, so its dev numbers are optimistic). Here: ~74 synthetic text scripts written
# fresh from config/synth_scenarios.yaml (twins per scenario: alarm / harmless / review, other companies,
# relatives, amounts, advisor-side misconduct, training quotes) by `callguard synth scripts`.
# ORACLE text (reference scripts, no ASR): measures the checks' reasoning, not transcription.
# Same served LLM for every variant: `v1` computes all checks of config/synth-oracle.yaml once (facts and
# facts_blind at weight 0 = not fused; facts_blind = R4 blind table written without transcripts),
# the others re-fuse those stored results (exactly paired, no new LLM calls).
# Split `external`: only dialogues that are in no fold of config/splits.yaml (synthetic): no holdout look.
# Resampling / CV unit = scenario (twin group, header line "Gruppe:").
# Circularity caveat: the scripts are written by the same served LLM that judges them (see
# research/journal.md D1 entry); labels come from the scenario file, never from the LLM.
name: synth_stress
description: Synthetic out-of-sample stress test (ORACLE text) - v1 checks vs facts vs judge+facts
rq: [RQ5, RQ10]
base: synth-oracle
split: external
compare_to: v1
variants:
  - name: v1
    description: keywords + patterns + llm_judge + geval (gpu-12gb v1); facts computed, weight 0
    # Qwen3 thinking off (as llm_models.yaml); other chat templates ignore the kwarg
    set: ["llms.default.extra_body={chat_template_kwargs: {enable_thinking: false}}"]
  - name: facts_only
    description: facts alone (policy table decides), re-fusion of v1
    refuse_from: v1
    checks: [facts]
    set: [checks.facts.weight=1.0]
  - name: judge_facts
    description: keywords + patterns + llm_judge + facts, re-fusion of v1
    refuse_from: v1
    checks: [keywords, patterns, llm_judge, facts]
    set: [checks.facts.weight=1.0]
  - name: kwpat_facts
    description: keywords + patterns + facts, re-fusion of v1
    refuse_from: v1
    checks: [keywords, patterns, facts]
    set: [checks.facts.weight=1.0]
  - name: hybrid
    description: facts decides, llm_judge may only escalate to review (fusion/hybrid.py), re-fusion of v1
    refuse_from: v1
    checks: [facts, llm_judge]
    set: [fusion.type=hybrid, checks.facts.weight=1.0]
  - name: facts_blind_only
    description: blind policy table alone (R4), re-fusion of v1
    refuse_from: v1
    checks: [facts_blind]
    set: [checks.facts_blind.weight=1.0]
  # R2 (table v3) with the champion's LLM: both computed fresh on Qwen2.5-7B (the stored v1/facts rows are 14B).
  - name: facts7b_v1
    description: facts alone with the tuned table v1, computed on the served Qwen2.5-7B (paired control for facts7b_v3)
    checks: [facts]
    set: [checks.facts.weight=1.0]
  - name: facts7b_v3
    description: facts alone with config/policy_table_v3.yaml (R2 open-fact review rules + splitting re-check), Qwen2.5-7B
    checks: [facts]
    set: [checks.facts.weight=1.0, checks.facts.policy_table=config/policy_table_v3.yaml]
