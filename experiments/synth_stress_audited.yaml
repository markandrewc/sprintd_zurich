# AUDITED subset of experiments/synth_stress.yaml: the 9 scripts marked invalid/doubtful in
# data_synth/v1/audit.json (label audit by a different model family, done before any result was seen)
# are left out (65 calls). NO new LLM calls: `src` holds the stored check results of synth_stress/v1
# (same served model) filtered to the audited calls; every reported variant re-fuses them.
# Run:
#   python3 scripts/research/synth_audit_seed.py      # writes runs/experiments/synth_stress_audited/src/
#   uv run callguard experiment experiments/synth_stress_audited.yaml --variants v1,facts_only,judge_facts,kwpat_facts,hybrid,facts_blind_only \
#     --calls "$(python3 scripts/research/synth_audit_seed.py --print-calls)"
name: synth_stress_audited
description: AUDITED subset (data_synth/v1/audit.json, invalid + doubtful scripts removed) of the synthetic stress test (ORACLE text) - v1 checks vs facts vs judge+facts
rq: [RQ5, RQ10]
base: synth-oracle
split: external
compare_to: v1
variants:
  - name: src
    description: seeded from synth_stress/v1 results (audited calls only); never computed here
    # Qwen3 thinking off (as llm_models.yaml); other chat templates ignore the kwarg
    set: ["llms.default.extra_body={chat_template_kwargs: {enable_thinking: false}}"]
  - name: v1
    description: keywords + patterns + llm_judge + geval (gpu-12gb v1), re-fusion of src
    refuse_from: src
  - name: facts_only
    description: facts alone (policy table decides), re-fusion of src
    refuse_from: src
    checks: [facts]
    set: [checks.facts.weight=1.0]
  - name: judge_facts
    description: keywords + patterns + llm_judge + facts, re-fusion of src
    refuse_from: src
    checks: [keywords, patterns, llm_judge, facts]
    set: [checks.facts.weight=1.0]
  - name: kwpat_facts
    description: keywords + patterns + facts, re-fusion of src
    refuse_from: src
    checks: [keywords, patterns, facts]
    set: [checks.facts.weight=1.0]
  - name: hybrid
    description: facts decides, llm_judge may only escalate to review (fusion/hybrid.py), re-fusion of src
    refuse_from: src
    checks: [facts, llm_judge]
    set: [fusion.type=hybrid, checks.facts.weight=1.0]
  - name: facts_blind_only
    description: blind policy table alone (R4), re-fusion of src
    refuse_from: src
    checks: [facts_blind]
    set: [checks.facts_blind.weight=1.0]
