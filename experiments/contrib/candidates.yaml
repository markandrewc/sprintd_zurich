    short: "Champion v3"
    group: Fakten
    model: Qwen2.5-7B-AWQ
    table: v3
    profile: recommended-v3
    tuned: champion/table_v3
    reworded: na                                 # no paraphrase of the v3 table exists
    blind: na                                    # the blind table replaces the whole table (see champion row)
    rerecorded: [perturbed:perturbed/table_v3, perturbed/table_v3]
    passages: ja
    hardware: "wie Champion"
    licence: "LLM Apache-2.0, ASR MIT"
    e2e: "teilweise (gleiche Kette, Profil recommended-v3; auf neuen Dateien nicht separat gelaufen)"
    note: "v3 wurde in Kenntnis eines Holdout-Fehlers (Aufteilen) entworfen; kein Holdout-Lauf."
