# Candidate systems for the open team decisions (docs/TEAM_OPTIONS.md, UI page "Team-Entscheidungen").
# Run:  uv run callguard candidates            (-> runs/candidates/candidates.json + docs/TEAM_OPTIONS.md)
# No model runs: every number comes from stored rows.json (+ results.jsonl for the evidence hit rate).
#
# Each candidate maps to stored experiment variants ("[root:]<experiment>/<variant>"; root `perturbed` =
# runs/perturbed/experiments, otherwise runs/experiments). A list = fallbacks (first available wins), except
# `reworded`, where every entry is one paraphrase set and the AUC is their mean. `na` = does not apply.
# A slot without rows.json is shown as "läuft noch" (variant folder exists), "ausstehend" (named in an
# experiments/*.yaml spec) or "nicht geplant"; it fills in on the next run / UI reload.
#
# Mapping verified 2026-10-10 against each variant's meta.json (profile, LLM ids, --set) and experiments/*.yaml:
#   champion/champion == kev_vs_facts/champion (same rows, AUC 0.866); champion/para == kev_vs_facts/qwen_facts_para.
#   runs/experiments/perturbed/* == runs/perturbed/experiments/perturbed/* (copies; the perturbed root is primary).
#   Qwen3.8 (both quantisations) and Kev read the facts with `evidence: false`: their passages come from the
#   keyword/pattern hits only. Roles (advisor/customer) of every candidate come from the Qwen2.5-7B cache.
name: candidates
description: Candidate matrix for the team decisions (dev split, paired against the champion)
reference: champion
rows: cv
n_boot: 2000
seed: 13
data_roots:
  default: runs/experiments
  perturbed: runs/perturbed/experiments
evidence_note: >-
  Beleg hit@1 = Anteil der richtig markierten Anrufe, deren erste angezeigte Passage eine annotierte Beleg-Zeile
  trifft (`callguard evidence-eval`-Methode, Dev). „Zufall“ = was eine gleich lange Passage an zufälliger Stelle
  träfe: lange Passagen (Kev allgemein, ~48 s) treffen schon zufällig oft. Anrufe ohne Passage zählen als
  Fehltreffer.

candidates:
  # ---- facts design (tuned questions + policy table) ----------------------------------------------------------
  - id: champion
    label: "Champion: Qwen2.5-7B Fakten, Tabelle v1"
    short: "Champion v1"
    group: Fakten
    model: Qwen2.5-7B-AWQ
    table: v1
    profile: recommended
    tuned: champion/champion
    evidence_ref: kev_vs_facts/champion          # identical rows; this copy has results.jsonl
    reworded: [kev_vs_facts/qwen_facts_para, kev_vs_facts/qwen_facts_para2]
    blind: kev_vs_facts/qwen_facts_blind
    rerecorded: [perturbed:perturbed/perturbed, perturbed/perturbed]
    passages: ja
    hardware: "12 GB 4070 gestaffelt (ASR, dann vLLM); 24 GB: alles zusammen"
    licence: "LLM Apache-2.0, ASR MIT"
    e2e: "ja (gestaffelt, neue Dateien, Journal 04:50)"
    note: "Eingefroren, einziger Kandidat mit Holdout-Lauf (3 Blicke, nur Plausibilität)."
  - id: champion_v3
